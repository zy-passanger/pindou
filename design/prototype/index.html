  <header class="reviewbar">
    <div class="reviewbar__brand">
      <span class="logo-mark logo-mark--dark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="reviewbar__name">拼豆工坊</span>
      <span class="reviewbar__badge">交互设计稿 v0.1</span>
    </div>
    <div class="reviewbar__sizes" role="group" aria-label="预览尺寸">
      <button class="review-size is-active" data-size="auto">自适应</button>
      <button class="review-size" data-size="1024x768">平板横屏</button>
      <button class="review-size" data-size="768x1024">平板竖屏</button>
      <button class="review-size" data-size="390x844">手机</button>
    </div>
    <div class="reviewbar__actions">
      <button class="review-action" data-action="open-system" aria-label="设计系统"><svg class="icon" aria-hidden="true"><use href="#i-layers"></use></svg><span>设计系统</span></button>
      <button class="review-action" data-action="reset-demo" aria-label="重置示例"><svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg><span>重置</span></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="device-wrap" id="device-wrap">
      <div class="device-scale" id="device-scale">
        <div class="device" id="device">
          <div class="device__screen" id="app" data-layout="wide" data-view="home">
            <div class="view-root" id="view-root"></div>
            <div class="overlay-root" id="overlay-root"></div>
            <div class="toast-root" id="toast-root" aria-live="polite"></div>
          </div>
        </div>
      </div>
      <div class="device-label" id="device-label">自适应</div>
    </div>
  </main>
